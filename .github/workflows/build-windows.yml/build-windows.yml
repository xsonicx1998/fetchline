# Build the Fetchline Windows installer on GitHub's Windows runners.
#
# Triggers on every push to main and manually (Actions > Run workflow).
# No secrets are required: the build uses only public toolchains, and the
# installer is published as a workflow artifact (Actions tab > Artifacts).
#
# Notes:
# - The Tauri shell does not compile on the Linux dev VM (missing gdk-3.0),
#   so this workflow is the first place a real Windows build is produced.
# - Icon PNG/ICO files are binary and are not stored in the repo; they are
#   regenerated here from the project's own artwork (scripts/generate-icons.py)
#   and then expanded into the Tauri set with `tauri icon`.
# - The engine test step FAILS the run on failure (no
#   continue-on-error): BUG-031 proved the suite did not compile on
#   Windows while the step was continue-on-error, so the break stayed
#   hidden — a Windows-only compile/test failure must fail the run
#   visibly now.
# - EXCEPTION: the real-download test (real_download_tests.rs) runs in its
#   own step WITHOUT continue-on-error — it downloads a pinned file from
#   the real internet through the real engine and verifies the bytes, so
#   it must fail the run when it fails.
# - The smoke-test job below installs the freshly built MSI on the runner,
#   launches the app, and checks it stays alive with a clean startup.log.
#   It exists because BUG-029 (setup called tokio::spawn outside any Tokio
#   runtime, so the app flashed blank and died) was only ever caught on the
#   user's PC — a green build alone does not prove the app launches.
# - The extension-capture-test job proves a link from a real browser
#   reaches the app: it drives the real fetchline-host binary with real
#   Native Messaging frames, loads the unpacked extension in headless
#   Chrome and checks the popup reports a connection, then lets the app
#   drain the queue and verifies the downloaded file byte-for-byte.
#   It tests the GENUINE installed path: the MSI now ships
#   fetchline-host.exe and writes the native-messaging registry keys
#   (bundle.externalBin + resources + NSIS hooks / WiX fragment), so
#   the job reads the installed key + manifest instead of building
#   and registering a host itself.

name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/host

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Generate app icons
        run: |
          python -m pip install pillow
          python scripts/generate-icons.py
          npx --yes @tauri-apps/cli@2 icon app/src-tauri/icons/icon.png

      - name: Engine tests (smoke check)
        working-directory: app/engine
        run: cargo test

      # Real download test — the hard gate for the one test that proves
      # downloading works on Windows: it downloads a pinned file from
      # the real internet through the real engine and verifies the
      # bytes, so a failure here must fail the run. (The step above now
      # also fails the run — BUG-031 — but it only runs the suite
      # against local fixtures; this step is the only one that touches
      # the real internet.) The env var turns the tests on:
      # without it they print SKIPPED and pass (the Linux dev VM sits
      # behind a TLS-intercepting proxy the engine's rustls client
      # rejects — see real_download_tests.rs; the runner has direct
      # internet, so the tests run for real here).
      - name: Real download test (fails the run)
        working-directory: app/engine
        env:
          FETCHLINE_REAL_DOWNLOAD_TEST: "1"
        run: cargo test --test real_download_tests

      # Build the native-messaging host and stage it where Tauri looks
      # for external binaries: app/src-tauri/binaries/
      # fetchline-host-x86_64-pc-windows-msvc.exe (bundle.externalBin
      # "binaries/fetchline-host" in tauri.conf.json). The MSI/NSIS
      # installers then ship it next to fetchline.exe and register it
      # with the browsers — without this step the installer has no host
      # and browser capture cannot work for a user install (that was
      # the packaging gap). The host crate lives in app/host and is NOT
      # a dependency of the Tauri app, so `tauri build` alone never
      # builds it; it must be built here, before the installer step.
      - name: Build fetchline-host (external binary)
        working-directory: app/host
        shell: pwsh
        run: |
          cargo build --release -p fetchline-host
          New-Item -ItemType Directory -Force -Path ..\src-tauri\binaries | Out-Null
          Copy-Item target\release\fetchline-host.exe ..\src-tauri\binaries\fetchline-host-x86_64-pc-windows-msvc.exe
          Get-ChildItem ..\src-tauri\binaries

      - name: Build Windows installer (MSI + NSIS)
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fetchline-windows-installer
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Launch smoke test: install the MSI this run just built, run the app,
  # and prove it stays alive with a clean startup.log. This is the check
  # that would have caught BUG-029 (blank window, immediate close) before
  # any user ever installed the app. Runs on every push, after the build.
  smoke-test:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: fetchline-windows-installer
          path: installer

      - name: Install MSI and launch Fetchline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 1. Locate the MSI inside the downloaded artifact
          #    (layout is installer/msi/<name>.msi; search recursively so a
          #    future layout change does not silently break this step).
          $msi = Get-ChildItem -Path installer -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw "No MSI found under installer/" }
          Write-Host "Installing MSI: $($msi.FullName)"

          # 2. Silent install; fail the step if msiexec reports an error.
          #    Run msiexec via Start-Process -Wait -PassThru. The first
          #    version used "& msiexec.exe" + $LASTEXITCODE, but on the
          #    runner $LASTEXITCODE came back BLANK and the step died in 2 s
          #    before the install even ran (run 43684788098, job
          #    132723958339) — msiexec is a GUI-subsystem app and "&" does
          #    not reliably wait for it or set $LASTEXITCODE in
          #    non-interactive pwsh. -Wait + .ExitCode is the robust form.
          $msiProc = Start-Process -FilePath 'msiexec.exe' -ArgumentList '/i', "`"$($msi.FullName)`"", '/quiet', '/norestart', '/log', "`"$env:GITHUB_WORKSPACE\install.log`"" -Wait -PassThru
          $msiCode = $msiProc.ExitCode
          Write-Host "msiexec exit code: $msiCode"
          if ($null -eq $msiCode -or $msiCode -ne 0) {
            Write-Host "===== install.log tail ====="
            Get-Content "$env:GITHUB_WORKSPACE\install.log" -Tail 100 -ErrorAction SilentlyContinue
            Write-Host "===== end install.log ====="
            throw "MSI install failed (exit code $msiCode)"
          }
          Write-Host "MSI installed OK"

          # 3. Launch the app and give it 30 s to start.
          $exe = 'C:\Program Files\Fetchline\fetchline.exe'
          if (-not (Test-Path $exe)) { throw "fetchline.exe not found at $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "Launched fetchline, PID $($proc.Id)"
          Start-Sleep -Seconds 30

          # 4. Is the process still alive?
          $alive = Get-Process -Name fetchline -ErrorAction SilentlyContinue
          $stillRunning = ($null -ne $alive) -and (-not $proc.HasExited)
          Write-Host "Process alive after 30s: $stillRunning"
          if ($alive) { Write-Host "MainWindowTitle: '$($alive.MainWindowTitle)'" }

          # 5. Read the startup log (the diagnosis) and copy it to the
          #    workspace so the upload step can publish it.
          $logPath = Join-Path $env:APPDATA 'com.fetchline.app\fetchline\startup.log'
          $logOk = $false
          $backendReached = $false
          if (Test-Path $logPath) {
            $content = Get-Content $logPath -Raw
            Write-Host "===== startup.log ($logPath) ====="
            Write-Host $content
            Write-Host "===== end startup.log ====="
            Copy-Item $logPath "$env:GITHUB_WORKSPACE\startup.log" -Force
            $logOk = $content -match 'setup ok'
            $backendReached = $content -match 'frontend reached backend'
            Write-Host "startup.log contains 'setup ok': $logOk"
            Write-Host "startup.log contains 'frontend reached backend': $backendReached"
          } else {
            Write-Host "startup.log NOT FOUND at $logPath"
          }

          # 6. Desktop screenshot (best-effort only — never fails the step;
          #    the process-alive check and the log are the decisive signals).
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("$env:GITHUB_WORKSPACE\smoke-screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose(); $bmp.Dispose()
            Write-Host "Screenshot saved: smoke-screenshot.png"
          } catch {
            Write-Host "Screenshot failed (non-fatal): $($_.Exception.Message)"
          }

          # 7. Verdict, then always stop the app so the job ends cleanly.
          Stop-Process -Name fetchline -Force -ErrorAction SilentlyContinue
          if (-not $stillRunning) { throw "SMOKE TEST FAILED: fetchline process is not alive after 30s" }
          if (-not $logOk) { throw "SMOKE TEST FAILED: startup.log missing or does not contain 'setup ok'" }
          Write-Host "SMOKE TEST PASSED: process alive and startup.log contains 'setup ok'"

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetchline-smoke-test
          path: |
            startup.log
            smoke-screenshot.png
            install.log
          if-no-files-found: warn

  # Browser capture test: prove a link from a real browser reaches the
  # app on Windows. Runs scripts/capture-test.py in three phases:
  #   1. host: the real fetchline-host.exe, driven with real Native
  #      Messaging frames, enqueues a link into the app's real app.db
  #      (row verified in SQLite).
  #   2. browser: the unpacked extension loads in headless Chrome; its
  #      ID is discovered and checked against the stable id from
  #      manifest.json's key, the INSTALLED registry key + host manifest
  #      are read back and verified (they must point at the installed
  #      host with the stable id), and popup.html is opened and polled
  #      over CDP until it reports "Connected to the Fetchline desktop
  #      app".
  #   3. drain: the installed app drains the queue and downloads the
  #      pinned file; the script verifies its SHA-256.
  # This job depends on the MSI from build-windows: the host binary and
  # the registry keys it tests are the ones the installer ships and
  # writes (bundle.externalBin + resources + NSIS hooks / WiX fragment).
  # It no longer builds or registers a host itself.
  # What it does NOT prove: a human right-click ("Download with
  # Fetchline") or the download watcher cannot be driven in headless
  # Chrome — no mouse, no real popup window. Those use the same
  # sendNativeMessage + handToFetchline code Phase 2 exercises, and
  # the menu/watcher wiring is covered by the Node fake-chrome tests.
  extension-capture-test:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: fetchline-windows-installer
          path: installer

      - name: Install MSI and launch Fetchline once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -Path installer -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw "No MSI found under installer/" }
          Write-Host "Installing MSI: $($msi.FullName)"
          # Same robust form as the smoke test (Start-Process -Wait;
          # "& msiexec.exe" + $LASTEXITCODE came back blank in run
          # 43684788098 and died in 2 s before the install ran).
          $msiProc = Start-Process -FilePath 'msiexec.exe' -ArgumentList '/i', "`"$($msi.FullName)`"", '/quiet', '/norestart', '/log', "`"$env:GITHUB_WORKSPACE\install.log`"" -Wait -PassThru
          if ($null -eq $msiProc.ExitCode -or $msiProc.ExitCode -ne 0) { throw "MSI install failed (exit code $($msiProc.ExitCode))" }
          Write-Host "MSI installed OK"
          # Launch once so the app creates its database, then stop it:
          # the host test below writes to that same file, and the app
          # must not be running while it does (it would drain the row
          # before the check reads it).
          $exe = 'C:\Program Files\Fetchline\fetchline.exe'
          if (-not (Test-Path $exe)) { throw "fetchline.exe not found at $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "Launched fetchline, PID $($proc.Id)"
          Start-Sleep -Seconds 15
          Stop-Process -Name fetchline -Force -ErrorAction SilentlyContinue
          # Wait until it is really gone: the host test below opens the
          # same database file, and a half-exited app still holding it
          # would make the run flaky.
          for ($i = 0; $i -lt 10; $i++) {
            if (-not (Get-Process -Name fetchline -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 1
          }
          if (Get-Process -Name fetchline -ErrorAction SilentlyContinue) { throw "fetchline.exe did not stop after 10 s" }
          $db = Join-Path $env:APPDATA 'com.fetchline.app\fetchline\app.db'
          if (-not (Test-Path $db)) { throw "app.db not found at $db after first launch" }
          Write-Host "app.db exists: $db"

      - name: Install capture-test dependencies
        run: python -m pip install websocket-client

      - name: Run browser capture test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The host + registry key under test are the ones the MSI
          # installed (C:\Program Files\Fetchline\fetchline-host.exe);
          # the script reads the installed key + manifest and verifies
          # them instead of registering its own.
          python scripts/capture-test.py --host-exe 'C:\Program Files\Fetchline\fetchline-host.exe' --db-path "$env:APPDATA\com.fetchline.app\fetchline\app.db" --extension-dir "$env:GITHUB_WORKSPACE\app\extension" --chrome-exe 'C:\Program Files\Google\Chrome\Application\chrome.exe' --app-exe 'C:\Program Files\Fetchline\fetchline.exe' --url 'https://raw.githubusercontent.com/mohandksonic-ui/fetchline/7255dff9ec2863b16bda2772a839654b51274c32/LICENSE' --expected-sha256 'c2ef3696eecd8d51c0e615afe9437e5d620abcd9272b9d9f4bcbbd1e4a95f793' --downloads-dir "$env:USERPROFILE\Downloads"

      - name: Upload capture-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetchline-capture-test
          path: |
            capture-test-report.txt
            install.log
          if-no-files-found: warn
