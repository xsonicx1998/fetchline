[package]
name = "fetchline"
version = "0.1.0"
edition = "2021"
description = "Fetchline — desktop download manager (clean-room rebuild of download-manager behaviour)"
license = "MIT"

[lib]
name = "fetchline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fetchline"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
fetchline-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
# Round 67: the Add URL dialog's "..." browse button opens the
# native folder picker.
tauri-plugin-dialog = "2"
# Round 74 (9): a second launch focuses the running instance
# instead of opening a second copy.
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }

# Round 87.1 — forward the engine's `debug-hooks` feature
# (see app/engine/Cargo.toml): the VPS retest's TEST build
# enables it (`cargo tauri build --features debug-hooks`) so
# the debug env hooks fire there; the shipped installer is
# built with default features, hooks off.
[features]
debug-hooks = ["fetchline-engine/debug-hooks"]

# Round 57 (§9.1c): the `ProcessFailed` registration in lib.rs
# needs the raw WebView2 bindings — `wry::WebViewExtWindows` for
# the `ICoreWebView2` and `webview2-com` for the event handler.
# Windows-only: the Linux build never sees them. Both crates are
# already in Cargo.lock at these versions (via Tauri/wry), so this
# adds no new download on the VPS build.
[target.'cfg(windows)'.dependencies]
wry = "0.57"
webview2-com = "0.39"
# Round 75: the clipboard sequence number (Win32_System_DataExchange)
# is the clipboard change signal, and the named mutex
# (Win32_System_Threading + Win32_Foundation) tells the extension
# whether the app is alive. windows-sys 0.61 is already in the
# local registry cache, so this adds no new download on the VPS
# build.
# Round 87.5 (O2/U2) — Win32_UI_Shell + Win32_UI_WindowsAndMessaging
# for `ShellExecuteW` ("openas" verb): the "Open with..." dialog.
# The rundll32 `OpenAs_RunDLL` call it replaces silently did
# nothing on the VPS (see `open_file_with`); ShellExecuteW is the
# documented, Unicode-safe way to show the dialog. The
# ShellExecuteW link itself is gated on Win32_UI_WindowsAndMessaging
# (SHOW_WINDOW_CMD lives there) — both features are needed.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
