[package]
name = "fetchline"
version = "0.1.0"
edition = "2021"
description = "Fetchline — desktop download manager (clean-room rebuild of download-manager behaviour)"
license = "MIT"

[lib]
name = "fetchline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fetchline"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
fetchline-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
