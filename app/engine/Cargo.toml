[package]
name = "fetchline-engine"
version = "0.1.0"
edition = "2021"
description = "Download engine for the Fetchline desktop download manager (clean-room rebuild of download-manager behaviour)"
license = "MIT"

[lib]
name = "fetchline_engine"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Round 78 — SHA-256 verification of the yt-dlp update download
# (ytdlp.rs `update_ytdlp` checks the binary against the
# release's published SHA2-256SUMS before installing it).
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Only used by the settings-migration test, which builds a pre-migration
# database file by hand.
rusqlite = { version = "0.32", features = ["bundled"] }

# Round 75: the named mutex the extension's host probes to tell
# whether the app is alive (Win32_System_Threading +
# Win32_Foundation). Windows-only; the Linux build never sees it.
# windows-sys 0.61 is already in the local registry cache.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
