<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fetchline</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="32" height="32">
    <div>
      <h1>Fetchline</h1>
      <p id="status" class="status status-unknown">Checking connection…</p>
    </div>
  </header>

  <main>
    <label class="row">
      <span>Catch downloads in Fetchline</span>
      <input type="checkbox" id="catchToggle" checked>
    </label>
    <p id="desktopNote" class="note" hidden></p>

    <label class="row">
      <span id="siteLabel">Don’t catch downloads from this site</span>
      <input type="checkbox" id="siteToggle">
    </label>

    <button id="sendTab" type="button">Send this page to Fetchline</button>
    <button id="findVideos" type="button">Find videos on this page</button>
    <button id="openApp" type="button" class="secondary">Check the desktop app</button>
    <p id="pendingInfo" class="note" role="status">Waiting links: unknown — check the desktop app.</p>
    <p id="handoffInfo" class="note" role="status">Nothing sent to Fetchline yet.</p>
    <p id="result" class="note" role="status"></p>
    <p class="note">Fetchline can’t be launched from the browser. If the check above says the desktop app isn’t reachable, open Fetchline from the Start menu (Windows) or Applications, then try again.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
