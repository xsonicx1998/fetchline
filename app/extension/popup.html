<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sonic Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="Sonic Manager logo" width="32" height="32">
    <div>
      <h1>Sonic Manager</h1>
      <p id="status" class="status status-unknown"><span class="dot"></span><span id="statusText">Checking connection…</span></p>
      <p id="statusDetail" class="status-detail"></p>
    </div>
  </header>

  <main>
    <div class="dev-card">
      <div class="avatar" aria-hidden="true">M</div>
      <div class="who">
        <div class="label">Developer</div>
        <div class="name">Mohand Kandil</div>
      </div>
      <a
        class="fb"
        href="https://www.facebook.com/mohand.kandil/"
        target="_blank"
        rel="noopener"
        title="Mohand Kandil on Facebook"
      >f</a>
    </div>
    <p class="note">Downloads are caught automatically and open in <b>Sonic Manager</b> — confirm and start from the Add URL window.</p>
    <p id="scanLine" class="note"></p>
  </main>

  <footer class="foot">Sonic Manager extension · v0.1.0</footer>

  <script src="video-detect.js"></script>
  <script src="popup.js"></script>
</body>
</html>
